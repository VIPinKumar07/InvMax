name: Update InvMax data

on:
  schedule:
    - cron: "30 1 * * *"      # 07:00 IST daily
  workflow_dispatch:           # lets you run it by hand from the Actions tab

permissions:
  contents: write              # needed to commit the refreshed data back

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Show repository contents (diagnostic)
        run: |
          echo "--- files in repo ---"
          find . -maxdepth 3 -not -path './.git/*' -type f | sort

      # ── Step 1: the numbers ─────────────────────────────────
      # INVMAX_OUT is an ABSOLUTE path to the repo-root data/ folder, so the
      # file lands next to index.html no matter which folder the script is in.
      - name: Locate and run the fetcher
        env:
          INVMAX_OUT: ${{ github.workspace }}/data
        run: |
          FETCHER="$(find . -name 'fetch_data.py' -not -path './.git/*' | head -n 1)"
          if [ -z "$FETCHER" ]; then
            echo "::error::Could not find fetch_data.py anywhere in the repo."
            echo "Check the filename — it must be fetch_data.py (underscore, no space)."
            exit 1
          fi
          echo "Found fetcher at: $FETCHER"
          echo "Writing data to: $INVMAX_OUT"
          python "$FETCHER"

      # ── Step 2: the signals ─────────────────────────────────
      # Deterministic observed signals from the real price data. Pure code,
      # no LLM — this is the auditable ground truth the narration rests on.
      - name: Compute observed signals
        env:
          INVMAX_OUT: ${{ github.workspace }}/data
        run: |
          SIG="$(find . -name 'signals.py' -not -path './.git/*' | head -n 1)"
          if [ -z "$SIG" ]; then
            echo "::warning::signals.py not found — skipping signal step."
            exit 0
          fi
          echo "Found signal engine at: $SIG"
          python "$SIG" || echo "::warning::Signal step reported a problem; data is still valid."

      # ── Step 3: the words ───────────────────────────────────
      # Same INVMAX_OUT so the writer edits the SAME file the fetcher wrote.
      # Cascade: tries Groq first (free tier), falls back to GitHub Models
      # (uses the auto-available GITHUB_TOKEN — no secret needed for that one).
      - name: Generate the written view
        env:
          INVMAX_OUT: ${{ github.workspace }}/data
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SYNTH="$(find . -name 'synthesize.py' -not -path './.git/*' | head -n 1)"
          if [ -z "$SYNTH" ]; then
            echo "::warning::synthesize.py not found — skipping narrative step."
            exit 0
          fi
          echo "Found synthesizer at: $SYNTH"
          python "$SYNTH" || echo "::warning::Narrative step reported a problem; data is still valid."

      - name: Confirm the data file exists
        run: |
          DATA="$(find . -path '*data/latest.json' -not -path './.git/*' | head -n 1)"
          if [ -z "$DATA" ]; then
            echo "::error::data/latest.json was not produced."
            exit 1
          fi
          echo "Data file: $DATA"
          head -c 400 "$DATA"; echo

      - name: Commit the refreshed data
        run: |
          git config user.name  "invmax-bot"
          git config user.email "actions@github.com"
          git add -A -- '*data/latest.json' '*data/history.json' || true
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily data refresh $(date -u +'%Y-%m-%d')"
            git push
          fi
