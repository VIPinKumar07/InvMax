name: Update InvMax data

on:
  schedule:
    - cron: "30 1 * * *"      # 07:00 IST daily
  workflow_dispatch:           # lets you run it by hand from the Actions tab

permissions:
  contents: write              # needed to commit the refreshed data back

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Show repository contents (diagnostic)
        run: |
          echo "--- files in repo ---"
          find . -maxdepth 3 -not -path './.git/*' -type f | sort

      # ── Step 1: the numbers ─────────────────────────────────
      - name: Locate and run the fetcher
        run: |
          FETCHER="$(find . -name 'fetch_data.py' -not -path './.git/*' | head -n 1)"
          if [ -z "$FETCHER" ]; then
            echo "::error::Could not find fetch_data.py anywhere in the repo."
            echo "Check the filename — it must be fetch_data.py (underscore, no space)."
            exit 1
          fi
          echo "Found fetcher at: $FETCHER"
          cd "$(dirname "$FETCHER")"
          python "$(basename "$FETCHER")"

      # ── Step 2: the words ───────────────────────────────────
      # Writes the regime read, Hot notes and research note from the day's
      # numbers. If ANTHROPIC_API_KEY is missing or the call fails, the script
      # keeps yesterday's view (marked stale) or falls back to a plain
      # figures-only summary. It never fails the build.
      - name: Generate the written view
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INVMAX_MODEL: claude-sonnet-5
        run: |
          SYNTH="$(find . -name 'synthesize.py' -not -path './.git/*' | head -n 1)"
          if [ -z "$SYNTH" ]; then
            echo "::warning::synthesize.py not found — skipping narrative step."
            exit 0
          fi
          echo "Found synthesizer at: $SYNTH"
          cd "$(dirname "$SYNTH")"
          python "$(basename "$SYNTH")" || echo "::warning::Narrative step reported a problem; data is still valid."

      - name: Confirm the data file exists
        run: |
          DATA="$(find . -path '*data/latest.json' -not -path './.git/*' | head -n 1)"
          if [ -z "$DATA" ]; then
            echo "::error::data/latest.json was not produced."
            exit 1
          fi
          echo "Data file: $DATA"
          head -c 400 "$DATA"; echo

      - name: Commit the refreshed data
        run: |
          git config user.name  "invmax-bot"
          git config user.email "actions@github.com"
          git add -A -- '*data/latest.json' '*data/history.json' || true
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily data refresh $(date -u +'%Y-%m-%d')"
            git push
          fi
