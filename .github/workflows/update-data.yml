# InvMax — daily data refresh (self-diagnosing version)
# ---------------------------------------------------------------
# Put this file at:  .github/workflows/update-data.yml
#
# Runs once a day, fetches fresh public data, commits data/latest.json.
# This version FINDS the fetcher wherever you put it and prints clear
# messages, so you never get a cryptic "exit code 2" again.
#
# Cost: free for public repositories. Manual "Run workflow" button included.

name: Update InvMax data

on:
  schedule:
    - cron: "30 1 * * *"      # 07:00 IST daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Show repository contents (diagnostic)
        run: |
          echo "Files in the repo:"
          find . -type f -not -path './.git/*' | sort

      - name: Locate and run the fetcher
        run: |
          set -e
          # Find fetch_data.py wherever it landed (root, scripts/, anywhere).
          SCRIPT="$(find . -name 'fetch_data.py' -not -path './.git/*' | head -1)"
          if [ -z "$SCRIPT" ]; then
            echo "::error::Could not find fetch_data.py anywhere in the repo."
            echo "Fix: add the file so its path is exactly  scripts/fetch_data.py"
            echo "Make sure the name has an underscore and NO space: fetch_data.py"
            exit 1
          fi
          echo "Found fetcher at: $SCRIPT"
          python "$SCRIPT"

      - name: Show what was fetched
        if: always()
        run: |
          if [ -f data/latest.json ]; then
            python -c "import json;d=json.load(open('data/latest.json'));print('generated:',d['generated_at']);print('ok:',d['summary']['ok']);print('failed/stale:',d['summary']['failed'])"
          else
            echo "data/latest.json was not created — see the fetcher step above."
          fi

      - name: Commit updated data
        if: always()
        run: |
          if [ ! -f data/latest.json ]; then
            echo "Nothing to commit (no data file produced)."
            exit 0
          fi
          git config user.name  "invmax-bot"
          git config user.email "actions@github.com"
          git add data/latest.json
          if git diff --staged --quiet; then
            echo "No change in data — nothing to commit."
          else
            git commit -m "data: daily refresh $(date -u +'%Y-%m-%d')"
            git push
          fi
